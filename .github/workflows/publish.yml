name: Publish reviewed version

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact 40-character main commit shown in the final approved action
        required: true
        type: string
      expected_bundle_sha256:
        description: Exact public bundle hash shown in the final approved action
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check exact source, identity and public bundle
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EXPECTED_BUNDLE_SHA256: ${{ inputs.expected_bundle_sha256 }}
        run: node scripts/check-publication.cjs
      - name: Test this same source
        run: node --test tests/*.test.cjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the prepared artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
